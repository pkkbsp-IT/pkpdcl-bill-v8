name: Build PKPDCL APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf automake libtool libtool-bin pkg-config \
            libffi-dev m4 build-essential ccache

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-v8-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v8-${{ runner.os }}-

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip setuptools wheel cython==0.29.37 buildozer

      - name: Build Android APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ACLOCAL_PATH: /usr/share/aclocal:/usr/local/share/aclocal
          ACLOCAL: "aclocal -I /usr/share/aclocal -I /usr/local/share/aclocal"
          LIBTOOLIZE: /usr/bin/libtoolize
          AUTORECONF: /usr/bin/autoreconf
        run: |
          rm -rf .buildozer/android/platform/build-*/build/other_builds/libffi
          mkdir -p /tmp/bin
          cat << 'EOF' > /tmp/bin/autoreconf
          #!/usr/bin/env bash
          libtoolize --copy --force || true
          cat /usr/share/aclocal/libtool*.m4 /usr/share/aclocal/lt*.m4 >> aclocal.m4 2>/dev/null || true
          exec /usr/bin/autoreconf -f -i "$@"
          EOF
          chmod +x /tmp/bin/autoreconf
          export PATH="/tmp/bin:$PATH"
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkpdcl-bill-calculator-apk
          path: bin/*.apk
