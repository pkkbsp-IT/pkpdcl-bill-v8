name: Build PKPDCL APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install --user --upgrade buildozer cython==0.29.36 setuptools wheel

      - name: Bypass libffi autoreconf LT_SYS_SYMBOL_USCORE error
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          cat << 'EOF' > "$HOME/.local/bin/autoreconf"
          #!/usr/bin/env bash
          /usr/bin/autoreconf "$@" && exit 0
          RC=$?
          if [ -f "configure.ac" ] && grep -q "LT_SYS_SYMBOL_USCORE" configure.ac; then
            echo "Bypassing autoreconf failure due to LT_SYS_SYMBOL_USCORE..."
            aclocal --force || true
            libtoolize --force --copy || true
            autoconf --force || true
            automake --add-missing --copy --force || true
            if [ -x "./configure" ]; then
              exit 0
            fi
          fi
          exit $RC
          EOF
          chmod +x "$HOME/.local/bin/autoreconf"

          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pkpdcl-bill-calculator-apk
          path: bin/*.apk
