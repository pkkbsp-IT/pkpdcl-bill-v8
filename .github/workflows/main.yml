name: Build PKPDCL APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential ccache \
            autoconf automake libtool \
            pkg-config cmake \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo5 libffi-dev libssl-dev \
            libltdl-dev

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user \
            buildozer==1.5.0 \
            "cython<3.1" \
            setuptools wheel

      - name: Check project files
        run: |
          echo "Checking project..."
          ls -la
          test -f buildozer.spec
          echo "Buildozer spec found!"

      - name: Build Android APK
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          set +e
          buildozer android debug 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ "$EXIT_CODE" -ne 0 ]; then
            {
              echo "APK BUILD FAILED! EXIT_CODE=$EXIT_CODE"
              echo "=== KEY ERROR LINES ==="
              grep -iE "error:|exception|stderr|command failed|no space left" build.log | tail -n 50 || true
              echo ""
              echo "=== LAST 120 LINES OF BUILD LOG ==="
              tail -n 120 build.log
            } | tee error_summary.txt
            exit "$EXIT_CODE"
          fi

          echo "APK BUILD SUCCESSFUL!"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PKPDCL-Bill-Calculator-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PKPDCL-Build-Log
          path: |
            build.log
            error_summary.txt
          if-no-files-found: ignore
          retention-days: 7
